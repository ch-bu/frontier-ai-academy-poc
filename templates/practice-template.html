<!doctype html>
<html lang="{{LANGUAGE}}">
<head>
<meta charset="utf-8" />
<title>{{LESSON_TITLE}}</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #faf9f7; color: #1f1d1a; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 32px 24px 48px; }
  .chip { display: inline-block; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
          padding: 4px 10px; border-radius: 999px; background: #e3ece0; color: #4a6b41; margin-bottom: 14px; }
  h1 { font-size: 22px; margin: 0 0 18px; line-height: 1.3; }
  .body p { line-height: 1.55; margin: 0 0 14px; }
  .body blockquote { margin: 0 0 14px; padding: 10px 14px; background: #f1ede3; border-left: 3px solid #cbbf9c; border-radius: 4px; }
  textarea { width: 100%; box-sizing: border-box; min-height: 120px; font: inherit; padding: 12px; border-radius: 8px;
             border: 1px solid #d8d2c2; resize: vertical; background: #fff; color: inherit; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 14px; }
  .status { font-size: 12px; color: #8a8172; margin-top: 6px; min-height: 16px; }
  .progress { margin-top: 20px; padding: 12px 14px; border: 1px solid #e3ddce; border-radius: 8px; }
  .progress-label { font-size: 12px; color: #8a8172; margin-bottom: 8px; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { font-size: 12px; padding: 4px 9px; border-radius: 999px; background: #efece2; color: #8a8172; }
  .pill.on { background: #e3ece0; color: #4a6b41; }
  .footer { margin-top: 20px; font-size: 13px; color: #8a8172; }
  @media (prefers-color-scheme: dark) {
    body { background: #1b1a17; color: #eee9df; }
    .chip { background: #223420; color: #a9d19d; }
    .body blockquote { background: #26231b; border-left-color: #6b5f3f; }
    textarea { background: #24221c; border-color: #45412f; color: #eee9df; }
    .progress { border-color: #3a3626; }
    .pill { background: #26231b; color: #9a9280; }
    .pill.on { background: #223420; color: #a9d19d; }
    .status, .progress-label, .footer { color: #9a9280; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <span class="chip">Practice · {{LANGUAGE}}</span>
    <h1>{{LESSON_TITLE}}</h1>
    <div class="body">
      {{BODY_HTML}}
    </div>
    <textarea id="answer" placeholder="Write your answer here…"></textarea>
    <label class="row">
      <input type="checkbox" id="done" />
      <span>Mark practice as done</span>
    </label>
    <div class="status" id="status"></div>
    <div class="progress" id="progress"></div>
    <div class="footer">POC template — frontier-ai-academy-poc / practice-template.html · saved only in this browser</div>
  </div>
  <script>
    (function () {
      var ns = 'poc-lesson-{{LESSON_ID}}-{{LANGUAGE}}';
      var answerKey = ns + '-answer';
      var doneKey = ns + '-done';
      var answer = document.getElementById('answer');
      var done = document.getElementById('done');
      var status = document.getElementById('status');

      function read(key) {
        try { return localStorage.getItem(key); } catch (e) { return null; }
      }
      function write(key, value) {
        try { localStorage.setItem(key, value); return true; } catch (e) { return false; }
      }
      function pill(label, on) {
        return '<span class="pill' + (on ? ' on' : '') + '">' + label + '</span>';
      }

      function renderProgress() {
        var viewed = read(ns + '-viewed') === 'true';
        var practiceDone = done.checked;
        var hasAnswer = !!(answer.value && answer.value.trim());
        var feedbackLabel = 'not started';
        try {
          var fb = JSON.parse(read(ns + '-feedback') || '{}');
          var total = Object.keys(fb).length;
          if (total > 0) {
            var checked = Object.values(fb).filter(Boolean).length;
            feedbackLabel = checked + '/' + total;
          }
        } catch (e) {}

        document.getElementById('progress').innerHTML =
          '<div class="progress-label">Your progress (saved in this browser)</div>' +
          '<div class="pills">' +
            pill('Instructions' + (viewed ? ' ✓' : ''), viewed) +
            pill('Practice' + (practiceDone ? ' ✓' : hasAnswer ? ' (draft saved)' : ''), practiceDone || hasAnswer) +
            pill('Feedback ' + feedbackLabel, feedbackLabel !== 'not started') +
            pill('Language: {{LANGUAGE}} (remembered)', true) +
          '</div>';
      }

      write('poc-academy-language', '{{LANGUAGE}}');
      answer.value = read(answerKey) || '';
      done.checked = read(doneKey) === 'true';
      renderProgress();

      function save() {
        var ok = write(answerKey, answer.value) && write(doneKey, String(done.checked));
        status.textContent = ok ? 'Saved locally in this browser.' : 'Could not save locally (storage unavailable).';
        renderProgress();
      }

      answer.addEventListener('input', save);
      done.addEventListener('change', save);
    })();
  </script>
</body>
</html>
